name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # daily rebuild so a new Spotify episode shows up without a manual push
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # 1 = build for the mrdemonwolf.github.io/stuckbetweenpixels-website/ project
  # URL. Flip to 0 at the real cutover, once DNS points at GitHub Pages — see
  # "Custom domain cutover" in README.md.
  PREVIEW_DEPLOY: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo ships public/CNAME for the eventual custom-domain cutover.
      # Publishing it while previewing would make GitHub claim a domain that
      # still serves the old WordPress site, so drop it from preview builds.
      - name: Drop CNAME for preview deploys
        if: env.PREVIEW_DEPLOY == '1'
        run: rm -f public/CNAME

      - uses: withastro/action@v3
        with:
          package-manager: bun@latest
          # The action defaults to Node 20; Astro 7 requires >=22.12.0.
          node-version: 22
        env:
          PREVIEW_DEPLOY: ${{ env.PREVIEW_DEPLOY }}
          PODCAST_RSS_URL: ${{ vars.PODCAST_RSS_URL }}
          PODCAST_SPOTIFY_URL: ${{ vars.PODCAST_SPOTIFY_URL }}
          PODCAST_APPLE_URL: ${{ vars.PODCAST_APPLE_URL }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
