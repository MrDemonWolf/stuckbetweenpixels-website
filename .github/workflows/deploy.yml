name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # daily rebuild so a new Spotify episode shows up without a manual push
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          package-manager: bun@latest
        env:
          PODCAST_RSS_URL: ${{ vars.PODCAST_RSS_URL }}
          PODCAST_SPOTIFY_URL: ${{ vars.PODCAST_SPOTIFY_URL }}
          PODCAST_APPLE_URL: ${{ vars.PODCAST_APPLE_URL }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
